  - DOMAIN-SUFFIX,auth.openai.com,CHATGPT
  - DOMAIN-SUFFIX,auth0.openai.com,CHATGPT
  - DOMAIN-SUFFIX,api.openai.com,CHATGPT
  # Codex app assets/files (2026-10-18, same "speedup codex" pass):
  # cdn.oaistatic.com serves the app's static bundles, *.oaiusercontent.com its
  # attachments - neither had a rule and both rode the DIRECT catch-all.
  # Measured through omr: cdn.oaistatic.com 100 ms.
  - DOMAIN-SUFFIX,oaistatic.com,CHATGPT
  - DOMAIN-SUFFIX,oaiusercontent.com,CHATGPT
  - DOMAIN-SUFFIX,chatgpt.com,CHATGPT

