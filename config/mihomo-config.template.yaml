  # auth0.openai.com (owner follow-up, ~00:3x: "auth0.openai.com proxy to us or
  # tokyo") is the tenant host the platform sign-in redirects through; measured
  # 209 ms via aliyun-la / 212-307 ms via aliyun-tokyo (one noisy first round).
  # NOT the broader auth0.com: that is the whole identity provider, non-OpenAI
  # tenants included, and RULE-SET,clashmi-911 below already carries it.
  # api.openai.com (2026-10-17 early): the sign-in client's own account calls
  # (/auth, /mfa, /profile per the app binary) rode AUTO, whose HK/MY paid share
