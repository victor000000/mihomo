  # members were GENERATED, so they disappeared when an adapter went down and a
  # rule pointing at them could make the whole config invalid on a single-NIC
  # machine; a NIC-bound socket also cannot reach 127.0.0.1, which is where
  # HypoMux and the SSH tunnel live. Retired with the rings: mihomo holds no
  # adapter rings, and LOCAL is a `select [DISPATCH, DIRECT]` again (it dispatches too).
  #
  # SQX / Dukascopy bulk data. A separate hand-written group on purpose: its
  # members are hand-written and always exist, unlike the GENERATED per-NIC
  # outbounds above. It also leads with the free SSH tunnel, which is not dialled
  # through HypoMux and therefore survives a HypoMux outage.
  #
  # Why not AUTO: a fallback group resolves to ONE member for a whole health-check
  # interval, so a flaky paid node shows up as SSL failures in SQX (its log:
  # "SSL peer shut down incorrectly"). DATA is hand-written, so its exit can be
  # pinned by hand, and it health-checks the real Dukascopy URL, not a 204 page.
  # TRIED AND REVERTED 2026-10-11 17:3x, kept here so the next reader does not repeat it. The
  # owner's downloader log shows the feed failing with `Error code: 429` - a rate limit, not
  # bandwidth - clustered on some symbols while others succeed. Two route changes were tried:
  #   * this ring widened from 4 exits to 12 (more source IPs for a per-IP limit): 12 exits 0/16
  #     succeeded, 4 exits 8/16 - no benefit, possibly worse. Reverted.
  #   * one stable exit instead of the ring: 4/12 against 6/12. Reverted.
  # And serial probes at 17:26 returned 2/4 with the server answering 503 to half - Dukascopy
  # refuses even single requests, so the refusals are server-side and no routing choice moves them.
  # The ring stays at four because it is the measured-best of the three shapes, not because it is good.
  - name: DATA
    type: load-balance
    strategy: round-robin
    url: https://datafeed.dukascopy.com/datafeed/EURUSD/2024/00/02/08h_ticks.bi5
    interval: 600
    timeout: 12000
    lazy: false
    # Steady PAID exits (filter, not hard-coded names: the tags carry version
    # suffixes), health-checked on the real Dukascopy URL rather than a 204 page.
    use:
      - clashmi
    # A FEW stable exits, not one and not 49: a single IP hits Dukascopy's per-IP
    # 429, while 49 rotating IPs look like abuse and get their TLS handshakes
    # terminated (SQX logged 1,138 of those). Several steady exits split the load
    # while each keeps one identity.
    # NOT the 4:1 mix and NOT the Aliyun pair that used to be listed here: bulk
    # downloads want a few steady exits, and the free paths are the ones Dukascopy
    # blocks (owner, 2026-10-11: "give sqx datadownload all from proxy").
    filter: "香港|新加坡|日本|德国"

