# ==== GENERATED:PROXIES END ====

proxy-groups:
  # ===== 911-FIRST 4:1: four paid exits lead, the free Aliyun path takes 1 in 5 =====
  # `fallback` (not `url-test`) throughout: mihomo walks the list in order and uses
  # the first member that passes its health check. The free path is unlimited, so
  # ClashMi nodes are only touched when it is actually down.
  #
  # Do NOT change these to url-test: that picks whichever is fastest, which would
  # silently spend your 50GB subscription on every YouTube video.

  # HYPOMUX-PATH - which UPSTREAM, not which NIC: that is policy, and policy is
  # mihomo's job. Both members dial through `hypomux`, so the adapter stays
  # HypoMux's call. hy2-upstream can never win - hysteria2 is QUIC/UDP and cannot
  # traverse HypoMux's TCP SOCKS hop (measured: "aliyun-native 522 ms,
  # hy2-upstream FAILED") - so this resolves to aliyun-native, the path HypoMux
  # actually spreads. The catch-all is MATCH,DISPATCH (owner, 2026-10-11), so this
  # group - not MATCH - is what serves every domain a rule sends to AUTO.
  - name: HYPOMUX-PATH
    type: fallback
    proxies:
      # NOTE: hy2-upstream is deliberately NOT a member (removed 2026-10-11) - it can never
      # pass a check through the HypoMux hop, and as the first member of a fallback it only
      # made the group report unhealthy, which then silently emptied the free share of any
      # group referencing it. Kept in BENCH as an A/B target.
      - aliyun-native

  # AUTO is the PROXY PATH, and since 2026-10-11 it is a 4:1 MIX (owner: "for proxy, we
  # can use our 911 connect first and then use the aliyun server proxy (4:1), all through
  # hypomux dispatch").
  #
  #   * four 911 exits lead, with 香港|HK2022|AT - the owner's main 911 node and the
  #     fastest of the 49 measured (80 ms) - among them;
  #   * `aliyun-native` (shadowsocks to the Aliyun server) is the "1" share, so one
  #     connection in five rides Aliyun instead of the metered plan;
  #   * every member dials through `hypomux`, so HypoMux still chooses the adapter.
  #
  # `load-balance` + `round-robin`, NOT consistent-hashing: hashing pins a destination to
  # ONE member, so a flaky node becomes repeated failures for that destination, while
  # round-robin spreads connections and a retry lands on a different exit. The ratio is
  # by member count (4 of 5) - the only weighting mihomo groups offer. The four are
  # chosen with `filter`, not by listing names in `proxies`: a name that disappears from
  # the subscription would make the whole config invalid.
  #
  # The Aliyun member is `aliyun-native`, NOT `HYPOMUX-PATH`, and that is a measurement:
  # HYPOMUX-PATH = fallback [hy2-upstream, aliyun-native], hy2-upstream can never pass a
  # check through HypoMux (hysteria2 is QUIC, the hop is TCP SOCKS), so the group reports
  # itself unhealthy - and a load-balance skips unhealthy members, which is how the first
  # version of this mix sent 10 of 10 test connections to the paid nodes with a silent
  # 0-in-5 Aliyun share. Measured: aliyun-native 366 ms alive, hy2-upstream failed.
  #
  # HISTORY, kept: AUTO used to be a `fallback` leading with HYPOMUX-PATH - free-first,
  # metered plan as last resort - and its interval was dropped 120 s -> 60 s because a
  # reload left the free group unhealthy for a moment. The owner reversed the priority;
  # the interval lesson survives. Quota note: 4 of 5 proxied connections now spend the
  # metered 911 plan.
  - name: AUTO
    type: load-balance
    strategy: round-robin
    url: https://www.google.com/generate_204
    expected-status: 204
    interval: 60
    timeout: 5000
    lazy: false
    filter: '(香港\|HK2022\|AT|台湾\|TW2035\|AT|新加坡\|SG2034\|AT|马来西亚\|MY2032\|AT)'
    proxies:
      - aliyun-native
    use:
      - clashmi
  # ==== GENERATED:AUTO BEGIN ====
  # LEGACY RING REGION - retired for real on 2026-10-11: the watcher generated HY2LB
  # (a per-NIC hysteria2 ring) and the AUTO that led with it here. It no longer
