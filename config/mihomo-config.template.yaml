  # Local path - traffic that must NOT be proxied: DOMAIN-SUFFIX,cn and the rest
  # of the explicit DIRECT rules below. MATCH is HYPOMUX-PATH now, so nothing
  # reaches this group except an explicit LOCAL rule.
  #
  # `select` rather than a bare MATCH so there is a place to force an exit
  # by hand when diagnosing.
  #
  # LEGACY, reframed: HypoMux used to sit here too, so that even non-proxied
  # traffic was spread across NICs. The renewed design puts HypoMux only in the
  # path of PROXIED dials (docs\HYPOMUX-DISTRIBUTION.md), and the ring this group
  # selected (DIRECT-LB -> direct-nic5/direct-nic50) is retired.
  #
  # TRAP: a NIC-bound socket cannot reach 127.0.0.1, and mihomo reaches HypoMux at
  # 127.0.0.1:10800 - which is why the loop-protection rules below send 127/8,
  # 10/8, 172.16/12 and 192.168/16 to plain DIRECT, and why nothing NIC-bound
  # belongs in this group.
  - name: LOCAL
    type: select
    proxies:
      - DISPATCH
      - DIRECT
  # ==== GENERATED:LOCAL BEGIN ====
  # LEGACY RING REGION - retired for real on 2026-10-11: the watcher generated
  # `LOCAL` here, selecting DIRECT-LB and the per-NIC outbounds. It no longer writes
  # this region (the switch moved `LOCAL` out, above, and emptied this body),
  # nothing may be added back, and the markers stay because the live file and CI
  # both key on them.
  # ==== GENERATED:LOCAL END ====
# ---------------------------- Rules ---------------------------
# Since 2026-10-11 the catch-all is MATCH,DISPATCH: only what a rule names is
# proxied - our measured set, the 911 subscription's own must-proxy list
# (RULE-SET,clashmi-911), the learner's escalations - and Microsoft Store /
# Windows Update are pinned off the proxy ahead of everything. Everything else is
# dispatched direct (DISPATCH -> HypoMux picks the NIC); only loopback and the
# private / link-local ranges still follow the OS route. Before that the catch-all
# was MATCH,DIRECT, and MATCH,HYPOMUX-PATH before that, so it proxied every
# unmatched destination.
# Basis: measured 2026-10-10 - see archive\smartdns\smartdns.conf section 5c/8.
rules:

  # ---------- Microsoft Store + Windows Update: DIRECT (owner, 2026-10-11) ----------
  # Measured 2026-10-10: the Store downloads from a domestic CDN at ~17.8 MB/s, so
  # proxying it spends quota to go slower. These sit ABOVE the auto-learner and
  # above the 911 rule set on purpose (first match wins): a learned "direct failed"
  # entry - the learner had picked up windows.com and msftncsi.com - or the 911 list
  # (it carries DOMAIN-SUFFIX,windows.com) must not drag Store/Update back onto the
  # proxy. The learner's explicit-rule guard reports hand-written rules for review
  # instead of overriding them, so this stays put.
  # `copilot.microsoft.com` is the one Microsoft host the 911 list wants proxied, so
  # it is excepted first - deliberate, not an oversight.
  # Verified: displaycatalog.mp.microsoft.com and download.windowsupdate.com ->
  # `match DomainSuffix(microsoft.com|windowsupdate.com) using DIRECT`.
  - DOMAIN,copilot.microsoft.com,AUTO
  # ---------- the Store's SERVICE hosts: AUTO (measured 2026-10-12 06:2x-06:4x) ----------
  # Owner, 2026-10-12: "i still cant open microsoft store, recheck the network for this". Two
  # faults were measured, and this block is the first.
  #
  # The Store's own event log (Microsoft-Windows-Store/Operational) named the failing calls, and
  # every one of them is either un-routed or on the DISPATCH path:
  #   storeedge.microsoft.com       -> 0x80072EFD (never reached mihomo at all: NOT in ANY rule,
  #                                    so it went direct, and direct is blocked here)
  #   da.xboxservices.com           -> 0x80072EFD through DISPATCH (0 dial failures logged for the
  #                                    STORE, but this rule set's problem is different - see below)
  #   storeedgefd.dsx.mp.microsoft.com / collections.mp.microsoft.com / displaycatalog.mp.microsoft.com
  #                                 -> already AUTO (the mp.microsoft.com pin), and still logging
  #                                    `failed to create session: context deadline exceeded`
  #   recent.svc.cloud.microsoft    -> `dial DISPATCH (match Match/) ... context deadline exceeded`
  #   createcatalog.public.onecdn.static.microsoft -> same, `dial DISPATCH (match Match/)`
  #
  # Probed by hand, the SAME hosts answer on both paths (storeedge 404, svc.cloud 405, onecdn 400,
  # displaycatalog 204, and storeedge's real API `/v9.0/pages/home?market=CN...` answered 200 in
  # 0.15 s through the mix) - so the network is not the fault; the ROUTING of these families is.
  # cloud.microsoft and onecdn.static.microsoft are the Store's modern service/CDN hosts and were
  # covered by NO rule, i.e. they were falling through to MATCH,DISPATCH and dying there.
  # `da.xboxservices.com` is the Digital Attachment feed the Store blocks its first paint on: it
  # moves to AUTO with the rest of the service set, because DISPATCH is measurably unreliable for
  # Microsoft's service hosts (graph.microsoft.com, officeclient.microsoft.com, substrate.office.com
  # all logged `context deadline exceeded` on it) while the 4:1 mix carried the same calls.
  # The BULK delivery rules below keep DISPATCH: that half rests on a real measurement (~17.8 MB/s
  # from a domestic CDN) and is a different kind of traffic from these APIs.
  #
  # 2026-10-14 EVENING (owner: "how about microsoft store"): the routes were right and the exits
  # were not - with one or two AUTO members dead for this URL, the Store's retries still fed them
  # (0x80072EFD burst in its event log 16:25-16:26). The SERVICE hosts below now ride `STORE`,
  # the url-test group that health-checks `/v9.0/pages/home` every 30 s and dials only members
  # that passed; the BULK families keep their existing paths.
  - DOMAIN-SUFFIX,svc.cloud.microsoft,STORE
  - DOMAIN-SUFFIX,storeedge.microsoft.com,STORE
  # NOTE: `xboxservices.com` is NOT re-declared here - the rule already in the Xbox block below
  # was re-pointed from DISPATCH to AUTO for this measurement, because a second copy would be dead
  # weight (first match wins) and the repo's own rule-integrity check rejects duplicates by name.
  - DOMAIN-SUFFIX,onecdn.static.microsoft,STORE
  # Live connection capture, 2026-10-12 07:2x: with the Store open, `/connections` showed exactly one
  # Microsoft connection actually carrying bytes - `fd.api.iris.microsoft.com`, 3,971 bytes up,
  # chained `hypomux>DISPATCH`. It is Microsoft's insights service and it is NOT a microsoft.com
  # name, so no rule covered it: it was on the unreliable DISPATCH path like the rest of the
  # Store's service calls. Small JSON API, nothing bulk rides it - AUTO with the others.
  - DOMAIN-SUFFIX,iris.microsoft.com,STORE
  # MEASURED 2026-10-11 20:1x: with everything under microsoft.com going DIRECT, the Store reported
  # "initialization failed" and the dial log showed its OWN service endpoints failing:
  #   array507.prod.do.dsp.mp.microsoft.com, collections.mp.microsoft.com, dl.delivery.mp.microsoft.com
  # The direct rule was justified by a CDN throughput measurement and that part still holds - the
  # delivery/asset families below keep going direct. The SERVICE endpoints the client must reach to
  # initialise at all go to the 4:1 mix. They sit ABOVE DOMAIN-SUFFIX,microsoft.com: first match wins.
  # mp.microsoft.com is a PARENT of the two families named here - adding them as separate
  # rules made them dead weight (a first-match engine never reached them), which the repo's own
  # rule-integrity check caught. One rule covers displaycatalog, collections, storeedgefd, dsx,
  # array*/disc*/kv*.prod.do.dsp and dl/tlu.delivery.
  - DOMAIN,displaycatalog.mp.microsoft.com,STORE     # the catalog API the first paint waits on
  - DOMAIN,collections.mp.microsoft.com,STORE        # collections API (same first-paint block)
  - DOMAIN-SUFFIX,dsx.mp.microsoft.com,STORE         # store edge front door (covers storeedgefd.dsx)
  - DOMAIN-REGEX,^.+\.prod\.do\.dsp\.mp\.microsoft\.com$,STORE  # array*/disc*/kv*/cp*/geo* service farms
  - DOMAIN-SUFFIX,mp.microsoft.com,AUTO              # parent: the delivery families + leftovers stay in the mix
  - DOMAIN-SUFFIX,events.data.microsoft.com,STORE    # the telemetry the client waits on
  - DOMAIN-SUFFIX,storequality.microsoft.com,STORE   # catalog revocation
  - DOMAIN-SUFFIX,store-images.s-microsoft.com,STORE # store artwork and metadata
  - DOMAIN-SUFFIX,microsoft.com,DISPATCH
  - DOMAIN-SUFFIX,windowsupdate.com,DISPATCH
  - DOMAIN-SUFFIX,windows.com,DISPATCH
  - DOMAIN-SUFFIX,msftconnecttest.com,DISPATCH
  - DOMAIN-SUFFIX,msftncsi.com,DISPATCH
  - DOMAIN-SUFFIX,microsoftstore.com,DISPATCH
  # MEASURED 2026-10-11 19:3x with the Store open: every Microsoft endpoint above matched and went
  # DISPATCH (direct) - EXCEPT the Akamai-served Store assets, which are not subdomains of
  # microsoft.com and were caught by the 911 provider list instead:
  #   img-prod-cms-rt-microsoft-com.akamaized.net   RuleSet(clashmi-911) -> AUTO[新加坡|SG2034|AT]
  # i.e. Store images and payloads rode a metered paid exit. Two things were needed:
  #   * a REGEX, not DOMAIN-SUFFIX: mihomo matches suffixes on LABEL boundaries and this family carries
  #     the name after a HYPHEN (`...rt-microsoft-com.akamaized.net`), so a suffix rule silently missed
  #     it - measured, the host still matched the 911 list after that rule was added;
  #   * process rules, because the owner's requirement is about the STORE, not about a host list: any
  #     CDN it reaches for should go direct. Not `svchost.exe` (every service is a svchost).
  - DOMAIN-REGEX,^[a-z0-9-]+-(microsoft-com|mscom)\.akamaized\.net$,DISPATCH
  - DOMAIN-SUFFIX,s-microsoft.com,DISPATCH
  # xboxservices.com was DISPATCH here, went AUTO on 2026-10-12, and rides STORE since 2026-10-14:
  # the STORE blocks its first paint on `da.xboxservices.com` (DigitalAttachmentFD) - 0x80072EFD
  # through DISPATCH on the day the Store's event log named it, and again on 2026-10-14 when AUTO
  # happened to dial a member that was dead for the Store's endpoints. Everything on this suffix
  # is a small API (that feed, `assets.xboxservices.com`) - no bulk rides it. Declared once, here,
  # so the (type,value) pair stays unique - a duplicate is dead weight the rule-integrity check rejects.
  - DOMAIN-SUFFIX,xboxservices.com,STORE
  - PROCESS-NAME,WinStore.App,DISPATCH
  - PROCESS-NAME,Microsoft.WindowsStore,DISPATCH
  - PROCESS-NAME,AppInstaller,DISPATCH
  - PROCESS-NAME,wsappx,DISPATCH
  - PROCESS-NAME,DoSvc,DISPATCH            # Delivery Optimization
  - PROCESS-NAME,MoUsoCoreWorker,DISPATCH  # Windows Update worker
  - PROCESS-NAME,usoclient,DISPATCH
  - PROCESS-NAME,wuauclt,DISPATCH
  # Measured 2026-10-11 19:4x: every Xbox host below was ALREADY direct - but only through the
  # catch-all `Match`, i.e. by luck of the provider list, which is exactly how the Store's Akamai
  # assets ended up proxied. Made explicit, for the same reason the Store block exists:
  #   xsts.auth / title.mgt / dlassets / images-eds-ssl / privacy / xbox-mbr / gssv .xboxlive.com
  #   www.xbox.com, compass-ssl.xbox.com, assets.xboxservices.com
  - DOMAIN-SUFFIX,xboxlive.com,DISPATCH
  - DOMAIN-SUFFIX,xbox.com,DISPATCH
  # Xbox processes, from the machine's own process list (Get-AppxPackage + Get-Process), so no CDN
  # or host family can leak the Xbox app or the Game Bar onto a metered exit.
  - PROCESS-NAME,GameBar,DISPATCH
  - PROCESS-NAME,GameBarFTServer,DISPATCH
  - PROCESS-NAME,GameBarPresenceWriter,DISPATCH
  - PROCESS-NAME,XboxGameBarWidgets,DISPATCH
  - PROCESS-NAME,XBox.TCUI,DISPATCH
  - PROCESS-NAME,XboxIdp,DISPATCH
  - PROCESS-NAME,XboxPcApp,DISPATCH
  - PROCESS-NAME,XboxPcAppFT,DISPATCH
  - PROCESS-NAME,StoreDesktopExtension,DISPATCH

  # DeepSeek: raw DIRECT (owner, 2026-10-12: "can you set the deepseekapi rule to
  # direct?"). DIRECT is the OS route, so these two rules leave HypoMux out of the
  # path - with loop protection they are the only rules here that do not ride the
  # DISPATCH hop. NOT LOCAL: LOCAL pulls a per-NIC ring, and DeepSeek through it
  # failed intermittently (TLS handshake resets, measured 2026-10-11).
  # They targeted DIRECT originally, rode DISPATCH from the third revision of
  # 2026-10-11 until this change, and were in the live config but lost from this
  # template when the dead duplicate LOCAL copies were removed (2026-10-11) -
  # restored then so the template matches the live file, which the repo-hygiene
  # ordering test checks.
  - DOMAIN-SUFFIX,deepseek.com,DIRECT
  - DOMAIN-KEYWORD,deepseek,DIRECT

  # ---------- HNCloud portal: raw DIRECT (owner, 2026-10-14: "visit u.hncloud.com
  # without proxy") ----------
  # The whole hncloud.com family had been escalated by the learner into
  # `autolearn-paid` (free-chain failures recorded earlier), so the browser rode
  # the 49-node worldwide PAID ring: log 09:05-09:08 shows u./www.hncloud.com
  # served by VN, LZ, UK, JED, IT and BEL exits inside three minutes, TTFB
  # through that path 2.2-5.3 s. Raw direct answers in 0.28-0.51 s (301/200,
  # measured 09:0x), and it keeps ONE source IP for a login session instead of
  # bouncing across exits and adapters. So the family is pinned raw DIRECT -
  # the second owner-ordered bypass of the dispatch hop (see DeepSeek above) -
  # placed above the autolearn rule-sets where first match wins; the learner's
  # safety rule #3 then leaves it alone, and its stale autolearn-paid entry
  # stops being refreshed and ages out under the 30-day TTL meanwhile.
  - DOMAIN-SUFFIX,hncloud.com,DIRECT

  # ---------- Tencent Cloud console: raw DIRECT (owner, 2026-10-14: "visit
  # cloud.tencent.com without proxy / update the rule") ----------
  # It already resolved to the non-proxy family (tencent.com,LOCAL below), but
  # the owner's order is a hard guarantee, and the hncloud lesson applies: any
  # EdgeOne-fronted host that ever fails a health window can be escalated by
  # the learner into a proxied bucket (hncloud.com ended up on the 49-node PAID
  # ring at 2.2-5.3 s TTFB). Measured 09:4x: direct on the good uplink answers
  # in 0.72-0.76 s TTFB (vs spiky 1.7-5.6 s on the other uplink - that
  # spikiness is EdgeOne/POP-side, not a routing fault). Raw DIRECT also keeps
  # one stable source IP for the console login session. Pin sits above the
  # autolearn rule-sets; the learner's safety rule #3 leaves it alone.
  - DOMAIN-SUFFIX,cloud.tencent.com,DIRECT

  # ---------- Taobao / Tmall / JD / Aliyun: raw DIRECT (owner, 2026-10-16:
  # "do not use proxy for https://www.taobao.com/ and jd.com", then "do not proxy
  # common-buy.aliyun.com" and "do not proxy aliyun.tmall.com") ----------
  # The two named families already resolved to the non-proxy block below
  # (taobao.com / jd.com were LOCAL), but that block sits BELOW the autolearn
  # rule-sets, and the learner had escalated sibling families into its proxy
  # buckets, where first match beat the domestic rules:
  #   alibaba-inc.com  the UMDC page telemetry every taobao.com page calls.
  #                    Measured 12:39-12:42 mid-session: umdc./loscv.alibaba-inc.com
  #                    rode AUTO (10 connections, exits TW/HK/MY). Probed 12:5x,
  #                    same minute: DIRECT answers 404 in 0.28 s, the proxied
  #                    path times out at 10 s - the learner had this backwards.
  #   jddebug.com      JD's front-end telemetry, on the AUTO path since learned.
  #                    The name does not resolve locally and timed out through
  #                    the proxy too (probed 12:5x), so the pin takes it off the
  #                    metered path; it fails fast instead of riding AUTO.
  #   alipcsec.com     Alibaba's PC-security SDK host, learned into the direct
  #                    bucket - any hit was riding AUTO (log 12:48). Same
  #                    reasoning as jddebug.com: off the proxy, fail fast.
  #   aliyun.com       the cloud console and the PURCHASE flow. It was NOT
  #                    proxied - the DOMAIN-SUFFIX,aliyun.com,LOCAL rule below
  #                    sent it through LOCAL[DISPATCH] - but the owner named
  #                    common-buy.aliyun.com on 2026-10-16, and the purchase flow
  #                    calls buy-api / query / cart / promotion on the same
  #                    suffix (log 13:03-13:04), so the whole family is pinned
  #                    raw DIRECT: no group hop, one stable egress for the
  #                    logged-in buy session, and nothing can re-escalate it.
  #   tmall.com        Taobao's sister storefront. It was NOT proxied either -
  #                    it rode the catch-all (Match -> DISPATCH[DIRECT], log
  #                    13:06-13:07: www/umdc/h5api/pass.aliyun.tmall.com) - but
  #                    nothing pinned it: only the domestic list stood between it
  #                    and a learned escalation. Pinned raw DIRECT with the
  #                    rest; tmall.hk (pass./list.tmall.hk in the same session)
  #                    joins the domestic list so it cannot be learned either.
  # The owner-named families and these pins sit ABOVE the autolearn
  # rule-sets and ABOVE the 911 set (first match wins), so the learner's safety
  # rules leave them alone (#2 domestic list - extended for the JD SSO families
  # in config\domestic-suffixes.txt the same day; #3 explicit rule). Raw DIRECT
  # also keeps ONE source IP for the shopping/login session instead of bouncing
  # adapters mid-session - the hncloud/cloud.tencent reasoning above. The stale
  # autolearn-direct entries (alibaba-inc.com, jddebug.com, alipcsec.com) stop
  # being refreshed and age out under the 30-day TTL meanwhile - these pins
  # shadow them from the moment the config reloads.
  - DOMAIN-SUFFIX,taobao.com,DIRECT
  - DOMAIN-SUFFIX,tmall.com,DIRECT
  - DOMAIN-SUFFIX,jd.com,DIRECT
  - DOMAIN-SUFFIX,alibaba-inc.com,DIRECT
  - DOMAIN-SUFFIX,jddebug.com,DIRECT
  - DOMAIN-SUFFIX,alipcsec.com,DIRECT
  - DOMAIN-SUFFIX,aliyun.com,DIRECT

  # ---------- US visa scheduling portal: the whole flow stays direct (owner, 2026-10-11) ----------
  # The portal and everything it needs to log in, so a session is never split between the
  # direct path and the proxy: usvisascheduling.com (portal), ustraveldocs.com (support),
  # b2clogin.com (its Azure AD B2C login), challenges.cloudflare.com (the bot challenge
  # that guards it), msauth.net / msftauth.net (login assets).
  # challenges.cloudflare.com is the one that was broken: the auto-learner carries
  # DOMAIN-SUFFIX,cloudflare.com and was sending the challenge script to the proxy while
  # the page it protects went direct - the classic way a "Just a moment..." check hangs.
  # Measured 2026-10-11: it answers 302 on the direct path, so direct is safe for it.
  # microsoftonline.com is deliberately NOT pinned: the portal's own auth is b2clogin.com,
  # and Office logins keep their measured AUTO rule.
  # SEPARATE FINDING, same day: the portal's name is POISONED by the local resolver (it
  # answers 141.193.154.210, not a Cloudflare address, no TCP 443), while 223.5.5.5,
  # 119.29.29.29, 180.76.76.76, 8.8.8.8 and DoH all agree on 172.64.146.157 /
  # 104.18.41.99. Routing could not have fixed that: the name is pinned in the Windows
  # hosts file (see docs\TODO.md), so the traffic stays direct and simply has a reachable
  # address. Refresh with:
  #   Resolve-DnsName www.usvisascheduling.com -Server 223.5.5.5 -Type A -DnsOnly
  - DOMAIN-SUFFIX,usvisascheduling.com,DISPATCH
  - DOMAIN-SUFFIX,ustraveldocs.com,DISPATCH
  - DOMAIN-SUFFIX,b2clogin.com,DISPATCH
  - DOMAIN-SUFFIX,challenges.cloudflare.com,DISPATCH
  - DOMAIN-SUFFIX,msauth.net,DISPATCH
  - DOMAIN-SUFFIX,msftauth.net,DISPATCH
  - DOMAIN-SUFFIX,msauthimages.net,DISPATCH
  - DOMAIN-SUFFIX,msftauthimages.net,DISPATCH

  # Public resolvers used by the DNS policy for overseas lookups. They are
  # addressed by IP, so a domain rule cannot catch them - and with the catch-all now
  # MATCH,DISPATCH they would go out direct and come back poisoned or null-routed if
  # this were left to the fallback. Pinning them to AUTO (the 4:1 mix, paid first) is
  # fallback) is therefore load-bearing, not decoration; it also records the trap
  # from when the catch-all was MATCH,LOCAL and they fell through it.
  - IP-CIDR,8.8.8.8/32,AUTO,no-resolve
  - IP-CIDR,8.8.4.4/32,AUTO,no-resolve
  - IP-CIDR,1.1.1.1/32,AUTO,no-resolve
  - IP-CIDR,1.0.0.1/32,AUTO,no-resolve

