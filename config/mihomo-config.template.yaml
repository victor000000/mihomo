  # 2026-10-16 night (owner: "proxy https://auth.openai.com/choose-an-account to
  # us or tokyo"): auth.openai.com - the sign-in + account chooser - pinned to
  # the SAME group (aliyun-tokyo now its last member) so chatgpt.com and the
  # login flow exit from one country, US-first. Through AUTO it measured 403
