name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks and tests (PowerShell ${{ matrix.powershell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        powershell: ['5.1', '7']

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap exact repository-local test dependencies
        shell: pwsh
        run: |
          $engine = if ('${{ matrix.powershell }}' -eq '5.1') { 'powershell.exe' } else { 'pwsh.exe' }
          & $engine -NoProfile -NonInteractive -File ./tools/Initialize-TestEnvironment.ps1
          exit $LASTEXITCODE

      # One authoritative check entry point; includes syntax checks for root,
      # product, tools and tests. Config/domestic/mix/ignore and synthetic learner
      # guards are also ordinary Pester tests, not separate inline YAML programs.
      - name: Run repository checks
        shell: pwsh
        run: |
          $engine = if ('${{ matrix.powershell }}' -eq '5.1') { 'powershell.exe' } else { 'pwsh.exe' }
          & $engine -NoProfile -NonInteractive -File ./tools/Invoke-RepoChecks.ps1 -Quiet
          exit $LASTEXITCODE

      - name: Run hermetic tests
        id: tests
        shell: pwsh
        run: |
          $engine = if ('${{ matrix.powershell }}' -eq '5.1') { 'powershell.exe' } else { 'pwsh.exe' }
          & $engine -NoProfile -NonInteractive -File ./tests/Run-Tests.ps1 -CI -Verbosity Detailed
          exit $LASTEXITCODE

      - name: Upload engine-scoped XML results
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-powershell-${{ matrix.powershell }}
          path: artifacts/test-results/powershell-${{ matrix.powershell }}.xml
          if-no-files-found: error

      - uses: actions/setup-python@v5
        if: matrix.powershell == '7'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: matrix.powershell == '7'
        with:
          node-version: '22'
      - name: Install packaged-source test dependencies
        if: matrix.powershell == '7'
        shell: pwsh
        run: python -m pip install -r tests/requirements.txt

      - name: Build source bundle
        if: success() && matrix.powershell == '7'
        shell: pwsh
        run: ./tools/Build-SourceBundle.ps1

      - name: Validate packaged source without a deployment
        id: source-export
        if: success() && matrix.powershell == '7'
        shell: pwsh
        run: ./tools/Test-SourceBundle.ps1

      - name: Upload packaged-source XML results
        if: always() && matrix.powershell == '7' && steps.source-export.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-source-export
          path: artifacts/test-results/source-export-7.xml
          if-no-files-found: error

      - name: Upload source bundle
        if: success() && matrix.powershell == '7'
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-toolkit-source
          path: artifacts/mihomo-toolkit.zip
          if-no-files-found: error

  policy:
    name: Python policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Check documentation links and anchors
        run: python tools/Check-Docs.py
      - name: Exercise offline policy fixtures
        run: python -m unittest discover -s tests/gateway -p "test_*.py"

  cache-sanitize:
    name: Offline cache migration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/cache-sanitize/go.mod
          cache-dependency-path: tools/cache-sanitize/go.sum
      - name: Test credential backup, cache preservation and writer lock refusal
        working-directory: tools/cache-sanitize
        run: go test ./...

  dashboard:
    name: Dashboard behavior
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise actual dashboard script with offline fixtures
        run: node --test tests/web/dashboard.test.cjs
